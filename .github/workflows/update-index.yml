name: Update Eagle Click index

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build index
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
        run: node build-index.mjs

      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eagle-index
          git diff --cached --quiet || git commit -m "Update Eagle Click index"
          git push
